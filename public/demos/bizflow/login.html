<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizFlow | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">B</div>
        <h1>BizFlow</h1>
        <p>Manage your business. All in one place.</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <div class="login-demo">
        <p>Demo Account</p>
        <button type="button" class="btn btn-ghost btn-block" id="fillDemo">
          admin@bizflow.com / admin123
        </button>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('fillDemo').addEventListener('click', () => {
      document.getElementById('email').value = 'admin@bizflow.com';
      document.getElementById('password').value = 'admin123';
    });
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if ((email === 'admin@bizflow.com' && password === 'admin123') || email.includes('@')) {
        localStorage.setItem('bizflow_user', JSON.stringify({ name: 'Sebastian', email }));
        window.location.href = 'index.html';
      } else {
        alert('Invalid credentials. Use the demo account.');
      }
    });
    if (localStorage.getItem('bizflow_user')) window.location.href = 'index.html';
  </script>
</body>
</html>
